:root{--lousa:#22493c;--giz:#f4f2e8;--am:#f7d966;--rosa:#f6b0a9;--papel:#fcfbf6;--pauta:#cfdcec;--margem:#e79a94;--tinta:#1d3c8c;--grafite:#2b2f36;--cinza:#5f6672;--verde:#1b7046;--ambar:#96600a;--verm:#bd342b;--marca:#fff3a6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--lousa);background-image:radial-gradient(ellipse at 15% 0,rgba(255,255,255,.07),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(255,255,255,.05),transparent 50%);background-attachment:fixed;color:var(--giz);font:17px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:0 16px 56px}
.giz{font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive}
h1,h2,h3,p{margin:0 0 12px}
h1:focus,h2:focus{outline:none}
button{font:inherit}
:focus-visible{outline:3px solid #e2a300;outline-offset:2px}

/* quadro */
.quadro{padding-top:36px}
.quadro p{max-width:58ch}
.aula{font-size:1.25rem;opacity:.85;margin-bottom:4px}
h1{font-size:clamp(2.8rem,11vw,4.6rem);line-height:.95;font-weight:400;margin-bottom:22px;padding-bottom:14px;border-bottom:3px solid var(--giz);border-radius:0 0 40% 10%/0 0 8px 4px;text-shadow:0 0 1px rgba(244,242,232,.7)}
.lead{font-size:1.15rem}
.pauta{list-style:none;padding:0;margin:18px 0;font-size:1.4rem;line-height:1.35}
.pauta li::before{content:"✓ ";color:var(--am)}
.quadro h2{font-size:clamp(2rem,8vw,3rem);line-height:1;font-weight:400;margin-bottom:16px}
.fase-n{font-size:1.3rem;color:var(--am);margin-bottom:2px}
.fonte{font-size:.85rem;opacity:.8}
footer{font-size:.82rem;opacity:.7;margin-top:36px;border-top:2px dashed rgba(244,242,232,.3);padding-top:14px}

/* botões */
.btn{display:inline-block;border:0;border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer;margin:8px 8px 0 0;background:var(--tinta);color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn.am{background:var(--am);color:#1a3a30}
.btn.borda{background:none;color:var(--giz);box-shadow:inset 0 0 0 2px var(--giz)}

/* placar no quadro */
.hud{position:sticky;top:0;z-index:2;background:var(--lousa);padding:12px 0 24px;border-bottom:2px dashed rgba(244,242,232,.35)}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem;margin-bottom:6px}
.ticks{display:flex;gap:7px}
.ticks span{width:13px;height:13px;border:2px solid var(--giz);border-radius:50%}
.ticks .ok{background:var(--giz)}
.ticks .now{background:var(--am);border-color:var(--am)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.meter{position:relative}
.meter span{display:flex;justify-content:space-between;font-size:1.1rem;line-height:1.2}
.meter b{font-weight:400;color:var(--am)}
.bar{height:13px;border:2px solid var(--giz);border-radius:3px 7px 4px 6px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-55deg,var(--am) 0 3px,rgba(247,217,102,.45) 3px 5px);transition:width .6s}
.delta{position:absolute;right:0;top:100%;font-style:normal;font-size:1.25rem;animation:sobe 1.6s forwards}
.delta.up{color:#c9f5d6}.delta.down{color:var(--rosa)}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}20%,75%{opacity:1}to{opacity:0;transform:translateY(-12px)}}

/* folha de caderno */
.folha{position:relative;background:var(--papel);color:var(--grafite);margin-top:20px;padding:26px 24px 28px 62px;border-radius:2px;box-shadow:0 12px 26px rgba(0,0,0,.3)}
.folha::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margem)}
.folha::after{content:"";position:absolute;left:15px;top:0;bottom:0;width:14px;background:radial-gradient(circle,var(--lousa) 6px,transparent 7px) 0 30px/14px 130px repeat-y}
.cab{font-size:.88rem;color:var(--cinza);border-bottom:1px solid var(--pauta);padding-bottom:8px;margin-bottom:14px}
.folha h2{font-size:1.45rem;line-height:1.25;font-weight:700}
.folha h3{font-size:1.1rem;margin-top:22px}
.ctx{color:var(--cinza)}
.folha .fonte{opacity:1;color:var(--cinza);margin:8px 0 0}

/* alternativas de prova */
.ops{counter-reset:o;margin-top:16px;border-top:1px solid var(--pauta)}
.op{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--pauta);padding:14px 10px 14px 48px;position:relative;color:inherit;cursor:pointer}
.op::before{counter-increment:o;content:counter(o,upper-alpha);position:absolute;left:8px;top:13px;width:27px;height:27px;border:2px solid var(--grafite);border-radius:50%;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.op:hover:not(:disabled){background:var(--marca)}
.op:disabled{cursor:default;color:#8a909a}
.op:disabled::before{border-color:#b3b8c0}
.op.pick,.op.best{color:var(--grafite)}
.op.pick::before{background:var(--tinta);border-color:var(--tinta);color:#fff}
.op.best{background:#e4f2e8}
.op.pick.n1{background:#fbf0d6}
.op.pick.n0{background:#fbe4e1}
.anot{display:block;font-size:1.1rem;line-height:1.2;margin-top:4px;color:var(--tinta)}
.best .anot.ok{color:var(--verde)}
.dica{font-size:.8rem;color:var(--cinza);margin:10px 0 0}
@media(hover:none){.dica{display:none}}
.vfs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.vf{background:none;border:2px solid var(--grafite);border-radius:6px;padding:14px;font-weight:700;font-size:1.1rem;color:inherit;cursor:pointer}
.vf:hover:not(:disabled){background:var(--marca)}
.vf:disabled{cursor:default;opacity:.45}
.vf.best{opacity:1;background:#e4f2e8;border-color:var(--verde);color:var(--verde)}
.vf.pick.n0{opacity:1;background:#fbe4e1;border-color:var(--verm);color:var(--verm)}
.frase{font-size:1.9rem;line-height:1.2;font-weight:400;color:var(--tinta)}

/* correção */
.fb{margin-top:22px}
.carimbo{display:inline-block;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:.9rem;border:3px double currentColor;border-radius:4px;padding:5px 14px;margin:0 0 14px -4px;transform:rotate(-3deg);animation:bate .3s cubic-bezier(.2,1.4,.5,1)}
@keyframes bate{from{opacity:0;transform:rotate(-3deg) scale(1.7)}}
.n2{color:var(--verde)}.n1{color:var(--ambar)}.n0{color:var(--verm)}
.efeitos{font-size:1.2rem;margin-bottom:14px}
.efeitos span{margin-right:14px;white-space:nowrap}
.efeitos .up{color:var(--verde)}.efeitos .down{color:var(--verm)}
.postit{background:var(--marca);padding:14px 16px;box-shadow:2px 3px 0 rgba(0,0,0,.12);margin-bottom:10px}

/* boletim */
.boletim{width:100%;border-collapse:collapse;margin:16px 0}
.boletim caption{text-align:left;font-weight:700;margin-bottom:6px}
.boletim th,.boletim td{border:1.5px solid var(--grafite);padding:8px 10px;text-align:left}
.boletim th{font-size:.85rem;background:#eef2f6}
.boletim .nota{font-size:1.6rem;line-height:1;color:var(--tinta);text-align:center}

details{border-top:1px dashed rgba(128,128,128,.55);padding:12px 0 2px;margin-top:16px}
summary{cursor:pointer;font-weight:700}
details ul,details ol,.folha ol{margin:10px 0 0;padding-left:22px}
li{margin-bottom:6px}
.rev{list-style:none;padding:0!important}
.rev li{border-top:1px solid var(--pauta);padding:10px 0}
.rev small{font-weight:800;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}
.refs li{font-size:.88rem;word-break:break-word}
@media(max-width:520px){.folha{padding:22px 16px 24px 44px}.folha::before{left:32px}.folha::after{left:9px;width:12px;background-size:12px 130px}.meters{gap:10px}.meter span{font-size:.95rem}.frase{font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}.carimbo,.delta{animation:none}}
</style>

function hud(){
  const t=FASES.map((_,i)=>'<span class="'+(i<S.f?'ok':i===S.f?'now':'')+'"></span>').join('');
  const mt=NOMES.map((n,i)=>'<div class="meter" data-k="'+i+'"><span>'+n+' <b>'+S.m[i]+'</b></span><div class="bar"><i style="width:'+S.m[i]+'%"></i></div></div>').join('');
  return '<header class="hud giz" aria-label="Indicadores da escola"><div class="hud-top"><span>Fase '+(S.f+1)+' de '+FASES.length+'</span><span class="ticks" aria-hidden="true">'+t+'</span></div><div class="meters">'+mt+'</div></header>';
}
function atualizaHud(ant){
  S.m.forEach((v,k)=>{
    const el=document.querySelector('.meter[data-k="'+k+'"]');if(!el)return;
    el.querySelector('i').style.width=v+'%';el.querySelector('b').textContent=v;
    const d=v-ant[k];
    if(d){const f=document.createElement('em');f.className='delta '+(d>0?'up':'down');f.textContent=(d>0?'+':'−')+Math.abs(d);el.appendChild(f);setTimeout(()=>f.remove(),1600)}
  });
}
function guia(){
  return '<details><summary>Guia para o professor: como usar em sala</summary>'+
  '<ul><li><b>Objetivo de aprendizagem:</b> reconhecer que o uso de tecnologias digitais na educação depende de planejamento, intencionalidade pedagógica e atenção à equidade.</li>'+
  '<li><b>Público:</b> estudantes de licenciatura e de cursos de tecnologia, professores em formação continuada e gestores escolares.</li>'+
  '<li><b>Duração:</b> 15 a 20 minutos de jogo, mais a discussão.</li>'+
  '<li><b>Sugestão de uso:</b> jogar em duplas, pedindo que justifiquem cada escolha antes de clicar. Ao final, comparar os boletins das duplas e discutir as situações em que houve mais divergência.</li>'+
  '<li><b>Avaliação:</b> pedir que cada dupla escreva uma nova situação-problema, com três alternativas, sobre um dos seis temas.</li>'+
  '<li><b>Requisitos:</b> qualquer navegador. Funciona sem internet e em celular.</li></ul></details>';
}
function inicio(){
  const sv=carrega();novo();
  tela('<section class="quadro"><p class="giz aula">Aula de hoje: Tecnologias Digitais na Educação</p>'+
  '<h1 class="giz" tabindex="-1" data-foco>Missão Escola Conectada</h1>'+
  '<p class="lead">Você assumiu a coordenação de tecnologia de uma escola pública em uma cidade pequena. A verba é curta, a internet cai e todo mundo espera resultado.</p>'+
  '<ul class="giz pauta"><li>6 fases, uma para cada tema da disciplina</li><li>'+TOTAL+' decisões que mexem com Aprendizagem, Equidade e Planejamento</li><li>6 desafios de mito ou fato</li></ul>'+
  '<p>Depois de cada escolha, você vê o que aconteceu na escola e o conceito que explica o porquê.</p>'+
  '<button class="btn am" id="go">Começar a missão</button>'+(sv&&sv.f>0&&sv.f<FASES.length?'<button class="btn borda" id="ct">Continuar da fase '+(sv.f+1)+'</button>':'')+
  guia()+'<details><summary>Temas abordados</summary><ol>'+FASES.map(f=>'<li>'+f.t+'</li>').join('')+'</ol></details>'+
  '<footer>Recurso educacional digital produzido por Enzo José Oliveira Pereira.<br>Disciplina Tecnologias Digitais na Educação, curso de Sistemas de Informação, UEMG Unidade Carangola, 2026/2.<br>Prof. Dr. Bertrand Lima.</footer></section>');
  document.getElementById('go').onclick=introFase;
  const ct=document.getElementById('ct');if(ct)ct.onclick=()=>{S=sv;introFase()};
}
function introFase(){
  salva();
  const F=FASES[S.f];
  tela(hud()+'<section class="quadro"><p class="giz fase-n">Fase '+(S.f+1)+'</p><h2 class="giz" tabindex="-1" data-foco>'+F.t+'</h2><p class="lead">'+F.intro+'</p><p class="fonte">Conteúdo da disciplina: '+F.fonte+'</p><button class="btn am" id="go">Ver a primeira situação</button></section>');
  document.getElementById('go').onclick=cena;
}
function cena(){
  const F=FASES[S.f],C=F.cenas[S.c];
  const ops=embaralha(C.ops.map((o,i)=>({t:o.t,i:i})));
  tela(hud()+'<section class="folha"><p class="cab">Fase '+(S.f+1)+', situação '+(S.c+1)+' de '+F.cenas.length+': '+F.t+'</p>'+
  '<h2 tabindex="-1" data-foco>'+C.q+'</h2><p class="ctx">'+C.ctx+'</p>'+
  '<div class="ops">'+ops.map(o=>'<button class="op" data-i="'+o.i+'">'+o.t+'</button>').join('')+'</div>'+
  '<p class="dica">Atalho: teclas A, B e C.</p><div id="fb" aria-live="polite"></div></section>');
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(F,C,+b.dataset.i));
}
function responde(F,C,i){
  const o=C.ops[i],ant=S.m;
  S.m=S.m.map((v,k)=>Math.max(0,Math.min(100,v+o.fx[k])));
  if(o.n===2)S.otimas++;
  S.hist.push({f:S.f,c:S.c,i:i});
  app.querySelectorAll('.op').forEach(b=>{
    const k=+b.dataset.i;b.disabled=true;
    if(k===i){b.classList.add('pick','n'+o.n);b.insertAdjacentHTML('beforeend','<span class="anot giz'+(o.n===2?' ok':'')+'">sua escolha</span>')}
    if(C.ops[k].n===2){b.classList.add('best');if(k!==i)b.insertAdjacentHTML('beforeend','<span class="anot giz ok">a mais bem planejada</span>')}
  });
  const dica=app.querySelector('.dica');if(dica)dica.remove();
  atualizaHud(ant);
  const ef=o.fx.map((v,k)=>v===0?'':'<span class="'+(v>0?'up':'down')+'">'+(v>0?'+':'−')+Math.abs(v)+' '+NOMES[k]+'</span>').join('');
  document.getElementById('fb').innerHTML='<div class="fb"><span class="carimbo n'+o.n+'">'+TAGS[o.n]+'</span><p>'+o.fb+'</p>'+
  (ef?'<p class="efeitos giz">'+ef+'</p>':'')+
  '<div class="postit"><b>Conceito.</b> '+C.conceito+'<p class="fonte">'+F.fonte+'</p></div>'+
  '<button class="btn" id="nx">Continuar</button></div>';
  const nx=document.getElementById('nx');nx.onclick=avanca;nx.focus({preventScroll:true});
  document.querySelector('.fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function avanca(){S.c++;if(S.c<FASES[S.f].cenas.length)cena();else mito()}
function mito(){
  const M=MITOS[S.f],ultima=S.f===FASES.length-1;
  tela(hud()+'<section class="folha"><p class="cab">Desafio da fase '+(S.f+1)+': mito ou fato?</p><h2 class="giz frase" tabindex="-1" data-foco>“'+M.t+'”</h2>'+
  '<p class="ctx">Se acertar, você reforça o indicador mais baixo da escola.</p>'+
  '<div class="vfs"><button class="vf" data-v="0">Mito</button><button class="vf" data-v="1">Fato</button></div><div id="fb" aria-live="polite"></div></section>');
  app.querySelectorAll('.vf').forEach(b=>b.onclick=()=>{
    const ok=(b.dataset.v==='1')===M.v;
    app.querySelectorAll('.vf').forEach(x=>{x.disabled=true;if((x.dataset.v==='1')===M.v)x.classList.add('best')});
    if(!ok)b.classList.add('pick','n0');
    let ef='';
    if(ok){S.bonus++;const k=S.m.indexOf(Math.min(S.m[0],S.m[1],S.m[2])),ant=S.m.slice();S.m[k]=Math.min(100,S.m[k]+4);atualizaHud(ant);ef='<p class="efeitos giz"><span class="up">+4 '+NOMES[k]+'</span></p>'}
    document.getElementById('fb').innerHTML='<div class="fb"><span class="carimbo n'+(ok?2:0)+'">'+(ok?'Acertou':'Errou')+'</span><p>É '+(M.v?'fato':'mito')+'. '+M.ex+'</p>'+ef+
    '<button class="btn" id="nx">'+(ultima?'Ver o boletim':'Ir para a próxima fase')+'</button></div>';
    const nx=document.getElementById('nx');nx.onclick=proxFase;nx.focus({preventScroll:true});
  });
}
function proxFase(){S.c=0;S.f++;if(S.f<FASES.length)introFase();else fim()}
function fim(){
  limpa();
  const media=Math.round((S.m[0]+S.m[1]+S.m[2])/3);
  let perfil,txt;
  if(media>=80){perfil='Planejador(a) estratégico(a)';txt='Suas decisões partiram dos objetivos de aprendizagem e consideraram quem tem menos acesso. A tecnologia entrou na escola com propósito.'}
  else if(media>=60){perfil='Integrador(a) em desenvolvimento';txt='Você acertou em boa parte das situações, mas em algumas a ferramenta veio antes do planejamento ou a equidade ficou em segundo plano.'}
  else{perfil='Entusiasta sem plano';txt='Há disposição para inovar, mas várias decisões colocaram o equipamento à frente do objetivo pedagógico. Vale jogar de novo observando os conceitos de cada fase.'}
  const sit=v=>v>=70?'Satisfatório':v>=50?'Em recuperação':'Precisa de reforço';
  tela('<section class="folha"><p class="cab">Missão concluída. Seu perfil na coordenação:</p><h2 tabindex="-1" data-foco>'+perfil+'</h2><p>'+txt+'</p>'+
  '<table class="boletim"><caption>Boletim da escola</caption><tr><th>Indicador</th><th>Nota</th><th>Situação</th></tr>'+
  NOMES.map((n,i)=>'<tr><td>'+n+'</td><td class="nota giz">'+S.m[i]+'</td><td>'+sit(S.m[i])+'</td></tr>').join('')+'</table>'+
  '<p><b>'+S.otimas+' de '+TOTAL+'</b> decisões bem planejadas e <b>'+S.bonus+' de '+MITOS.length+'</b> acertos em mito ou fato.</p>'+
  '<button class="btn" id="go">Jogar novamente</button>'+
  '<h3>O que esta missão mostrou</h3><ol>'+FASES.map(f=>'<li><b>'+f.t+':</b> '+f.resumo+'</li>').join('')+'</ol>'+
  '<div class="postit"><b>Ideia central.</b> A tecnologia não determina sozinha a qualidade da aprendizagem. O que faz diferença é o planejamento e a intenção com que ela é usada.</div>'+
  '<details><summary>Rever suas decisões</summary><ul class="rev">'+S.hist.map(h=>{const C=FASES[h.f].cenas[h.c],o=C.ops[h.i];return '<li><b>'+C.q+'</b><br><small class="n'+o.n+'">'+TAGS[o.n]+':</small> '+o.t+(o.n<2?'<br><span class="ctx">Mais bem planejada: '+C.ops.find(x=>x.n===2).t+'</span>':'')+'</li>'}).join('')+'</ul></details>'+
  guia()+'<details class="refs"><summary>Referências</summary><ul>'+REFS.map(r=>'<li>'+r+'</li>').join('')+'</ul></details></section>');
  document.getElementById('go').onclick=inicio;
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const n='123'.indexOf(e.key)>=0?+e.key-1:'abc'.indexOf(e.key.toLowerCase());
  if(n<0||e.key.length!==1)return;
  const b=app.querySelectorAll('.op:not(:disabled),.vf:not(:disabled)')[n];if(b)b.click();
});
inicio();
</script>
</body>
</html>
